version: 2
updates:
  # Docker image versions declared in docker-compose.yml (image: name:tag or name@digest).
  # Opens a PR whenever a newer version is available, serving governance rule 7 (component
  # longevity audit) automatically instead of relying on someone remembering to check.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait a week before proposing a newly published version, so a compromised release has
    # time to be detected and pulled upstream before it reaches this repository.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions used in .github/workflows/ (pinned by commit SHA; Dependabot updates the SHA
  # and its version comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
