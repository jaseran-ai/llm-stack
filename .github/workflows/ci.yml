name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  script-unit-tests:
    runs-on: self-hosted
    container:
      image: python:3.14.7-bookworm@sha256:ecac9e212daacda8a702eae372fceebc0ee36f5805abe087880367e8d061fa5b
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run script and startup graph unit tests
        run: make script-tests

  docker-compose-validate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate docker-compose.yml
        run: make compose-validate

  terraform-validate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate Cloudflare Terraform
        run: make terraform-validate

  shellcheck:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run shellcheck
        run: make shellcheck

  yaml-lint:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run yamllint
        run: make yamllint

  markdown-links:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check markdown links
        run: make markdown-links

  no-french-regression:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check for French text
        run: make no-french

  gitleaks:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        run: make gitleaks
