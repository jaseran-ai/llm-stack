    state: present
    identifiers:
      name: docs-forward-auth
    id: provider-docs
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://docs.%s", !Env DOMAIN]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: docs
    id: app-docs
    attrs:
      name: Documentation Utilisateur
      provider: !KeyOf provider-docs
      meta_launch_url: !Format ["https://docs.%s", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/docusaurus.png"
      meta_description: "Guides, tutorials, how-to, and public API reference."
      meta_publisher: "llm-stack"
      group: "Knowledge & Documentation"

  - model: authentik_policies.policybinding
