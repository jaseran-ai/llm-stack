    id: app-open-webui
    attrs:
      name: Open WebUI
      provider: !KeyOf provider-open-webui
      meta_launch_url: !Format ["https://chat.%s", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/open-webui.png"
      meta_description: "LLM chat interface with RAG, web search, and model switching."
