      meta_launch_url: !Format ["https://qdrant.%s/dashboard", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/qdrant.png"
      meta_description: "Vector database web dashboard and collection inspector."
