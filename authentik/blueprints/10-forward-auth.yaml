version: 1
metadata:
  name: llm-stack - Forward-Auth Applications & Outpost
  labels:
    blueprints.goauthentik.io/description: |
      Declares all forward-auth proxy providers, applications, RBAC policy bindings,
      and binds them atomically into the embedded Authentik outpost in a single transaction.
entries:
  # ----------------------------------------------------------------------------
  # 1. Dozzle (Logs)
  # ----------------------------------------------------------------------------
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: dozzle-forward-auth
    id: provider-dozzle
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://logs.%s", !Env DOMAIN]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: dozzle
    id: app-dozzle
    attrs:
      name: Dozzle
      provider: !KeyOf provider-dozzle
      meta_launch_url: !Format ["https://logs.%s", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/dozzle.png"
      meta_description: "Real-time Docker container log viewer."
      meta_publisher: "llm-stack"
      group: "Observability & System Monitoring"

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf app-dozzle
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
      enabled: true

  # ----------------------------------------------------------------------------
  # 2. Grafana Dashboards
  # ----------------------------------------------------------------------------
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: grafana-forward-auth
    id: provider-grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://grafana.%s", !Env DOMAIN]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: grafana
    id: app-grafana
    attrs:
      name: Grafana
      provider: !KeyOf provider-grafana
      meta_launch_url: !Format ["https://grafana.%s", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/grafana.png"
      meta_description: "Metrics dashboards and alerting (Prometheus, Loki)."
      meta_publisher: "llm-stack"
      group: "Observability & System Monitoring"

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf app-grafana
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
