    state: present
    identifiers:
      name: gatus-forward-auth
    id: provider-gatus
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://status.%s", !Env DOMAIN]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: status
    id: app-gatus
    attrs:
      name: Gatus Status
      provider: !KeyOf provider-gatus
      meta_launch_url: !Format ["https://status.%s", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gatus.png"
