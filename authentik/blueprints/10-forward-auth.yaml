  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf app-docs
      group: !Find [authentik_core.group, [name, users]]
      order: 1
    attrs:
      enabled: true

  # ----------------------------------------------------------------------------
  # 11. Architecture Documentation (arc42, C4, ADR) (Admins Only)
  # ----------------------------------------------------------------------------
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: arch-forward-auth
    id: provider-arch
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://arch.%s", !Env DOMAIN]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: arch
    id: app-arch
    attrs:
      name: Documentation Architecture
      provider: !KeyOf provider-arch
      meta_launch_url: !Format ["https://arch.%s", !Env DOMAIN]
      meta_icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/docusaurus.png"
      meta_description: "Internal architecture documentation, arc42, C4 models, and ADRs."
      meta_publisher: "llm-stack"
      group: "Knowledge & Documentation"

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf app-arch
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
      enabled: true

  # ----------------------------------------------------------------------------
  # 12. Embedded Outpost (Atomic Outpost Binding via !KeyOf)
  # ----------------------------------------------------------------------------
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      config:
        authentik_host: !Format ["https://authentik.%s", !Env DOMAIN]
      providers:
        - !KeyOf provider-dozzle
        - !KeyOf provider-grafana
        - !KeyOf provider-searxng
        - !KeyOf provider-seaweedfs-filer
        - !KeyOf provider-qdrant
        - !KeyOf provider-open-webui
        - !KeyOf provider-gatus
        - !KeyOf provider-traefik
        - !KeyOf provider-alertmanager
        - !KeyOf provider-docs
        - !KeyOf provider-arch
