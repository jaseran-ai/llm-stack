# ==============================================================================
# Prometheus Alertmanager Configuration
# 100% Declarative YAML configuration for alert routing and notifications.
# ==============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'

# No notification integration is configured by default: alerts are visible in the
# Alertmanager UI and Grafana. Add email, chat or webhook receivers here, see
# https://prometheus.io/docs/alerting/latest/configuration/#receiver
receivers:
  - name: 'default-receiver'

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'job']
