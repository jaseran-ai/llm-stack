# ==============================================================================
# LLM Stack — Documentation Container Tooling
# Strict, reproducible builds and diagram exports
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # User Documentation Site (Diátaxis)
  # ----------------------------------------------------------------------------
  docs-user-build:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    working_dir: /app
    volumes:
      - ./user:/app
    command: sh -c "[ -f node_modules/.bin/docusaurus ] || npm ci; npm run build"

  docs-user-dev:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    working_dir: /app
    volumes:
      - ./user:/app
    ports:
      - "127.0.0.1:3000:3000"
    command: sh -c "[ -f node_modules/.bin/docusaurus ] || npm ci; npm run start -- --host 0.0.0.0 --port 3000"

  # ----------------------------------------------------------------------------
  # Architecture Documentation Site (arc42 + C4 + ADR)
  # ----------------------------------------------------------------------------
  docs-arch-build:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    working_dir: /app
    volumes:
      - ./architecture:/app
      - ./shared:/app/shared:ro
    command: sh -c "[ -f node_modules/.bin/docusaurus ] || npm ci; npm run build"

  docs-arch-dev:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    working_dir: /app
    volumes:
      - ./architecture:/app
      - ./shared:/app/shared:ro
    ports:
      - "127.0.0.1:3001:3000"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 3000"

  # ----------------------------------------------------------------------------
  # Diagram Export: Mermaid CLI
  # ----------------------------------------------------------------------------
  docs-diagrams-mermaid:
    image: minlag/mermaid-cli:11.4.2@sha256:99c983b3ab4e14033f2880bc1b9de17e5090b4515dabd63fe9cf8c0ae6130956
    working_dir: /workspace
    volumes:
      - ..:/workspace
    entrypoint: ["sh", "-c"]
    command:
      - |
        for mmd in /workspace/docs/architecture/docs/diagrams/src/*.mmd; do
          if [ -f "$$mmd" ]; then
            base=$$(basename "$$mmd" .mmd)
            echo "Compiling Mermaid $$base.mmd -> $$base.svg"
            mmdc -i "$$mmd" -o "/workspace/docs/architecture/docs/diagrams/svg/$$base.svg" -b transparent
          fi
        done

  # ----------------------------------------------------------------------------
  # Diagram Export: Structurizr CLI (C4 Architecture Model)
  # ----------------------------------------------------------------------------
  docs-diagrams-structurizr:
    image: structurizr/cli:2025.11.09@sha256:0399ac8e24c16e41277cfcec22caa29e4775013e5395c0720016828426d62749
    working_dir: /workspace
    volumes:
      - ./architecture/docs/c4:/workspace
    entrypoint: ["sh", "-c"]
    command:
      - |
        /usr/local/structurizr-cli/structurizr.sh validate -w workspace.dsl && \
        /usr/local/structurizr-cli/structurizr.sh export -w workspace.dsl -f mermaid -o svg/

  # ----------------------------------------------------------------------------
  # OpenAPI Public Spec Generation & Leak Verifier
  # ----------------------------------------------------------------------------
  docs-openapi-filter:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: python3 /workspace/docs/scripts/generate-openapi-public.py
